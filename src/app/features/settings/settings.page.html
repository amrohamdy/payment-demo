<app-page-header
  eyebrow="System"
  title="API settings"
  subtitle="Point the app at the live backend without rebuilding. Changes reload the app."
/>

<div class="panel">
  <div class="status-row">
    <span>Health:</span>
    <p-tag
      [severity]="
        health.status() === 'live'
          ? 'success'
          : health.status() === 'unavailable'
            ? 'danger'
            : 'warn'
      "
      [value]="health.status()"
    />
    <span class="muted">{{ health.detail() }}</span>
    <p-button label="Recheck" icon="pi pi-refresh" [outlined]="true" size="small" (onClick)="recheck()" />
  </div>

  <form [formGroup]="form" class="form-grid" (ngSubmit)="save()">
    <label>
      <span>Base URL (host only, no /api/dhamen)</span>
      <input pInputText formControlName="baseUrl" placeholder="https://localhost:7134" />
    </label>
    <label>
      <span>Authority profile ID (optional)</span>
      <input pInputText formControlName="authorityProfileId" placeholder="GUID" />
    </label>
    <div class="actions">
      <p-button type="submit" label="Save & reload" icon="pi pi-save" />
    </div>
  </form>

  <p class="hint">
    You can also ship <code>public/runtime-config.json</code> with the deployed base URL so the app
    picks it up without a rebuild. Local settings override the file.
  </p>
</div>
